name: vs_console_app_validation
description: >
  Launch Visual Studio (or Visual Studio Insiders) from Start menu, create a
  new C# Console App project with default settings, capture the framework
  value, then validate Target Framework and Output Type in project Properties
  and .csproj file. Build and run the solution, verifying success at each
  stage, then maximize the editor window after creation and close the opened
  windows on completion.

inputs:
  search_text: "console app"
  expected_output_type: "Console Application"

artifacts:
  screenshot_dir: "screenshots/{timestamp}"

timing:
  after_win_key_ms: 700
  after_search_text_ms: 1500
  after_launch_enter_ms: 20000
  after_menu_click_ms: 800
  after_submenu_click_ms: 600
  after_dialog_action_ms: 3000
  after_search_type_ms: 3000
  after_select_template_ms: 1000
  after_next_click_ms: 3000
  after_create_click_ms: 30000
  after_view_menu_ms: 1000
  after_right_click_ms: 800
  after_properties_open_ms: 3000
  after_double_click_ms: 2000
  after_build_ms: 20000
  after_run_ms: 10000
  after_focus_click_ms: 300
  after_enter_ms: 3000
  validate_poll_total_ms: 10000
  validate_poll_interval_ms: 500
  after_close_ms: 1500

steps:

  # --- Launch Visual Studio ---

  - id: open_start_menu
    type: key
    description: "Open Start menu via Win key."
    script: scripts/input/key.py
    args: ["win"]
    wait_after: after_win_key_ms

  - id: search_visual_studio
    type: type_text
    description: "Type 'Visual Studio' into Start menu search."
    script: scripts/input/type_text.py
    args: ["Visual Studio", "--interval", "0.06"]
    wait_after: after_search_text_ms

  - id: launch_visual_studio
    type: key
    description: "Press Enter to launch Visual Studio."
    script: scripts/input/key.py
    args: ["enter"]
    wait_after: after_launch_enter_ms

  - id: find_vs_main_window
    type: find_window
    description: "Locate the VS main window (Microsoft Visual Studio or Visual Studio Insiders)."
    script: scripts/window/find_window.py
    args: ["^Microsoft Visual Studio( Insiders)?$", "--backend", "uia"]
    capture:
      vars.vs_hwnd: "$.cols[1]"
      vars.vs_left: "$.cols[2]"
      vars.vs_top: "$.cols[3]"
      vars.vs_right: "$.cols[4]"
      vars.vs_bottom: "$.cols[5]"

  - id: maximize_vs
    type: maximize
    description: "Maximize the Visual Studio main window."
    script: scripts/window/maximize_window.py
    args_expr: ["{vars.vs_hwnd}"]

  # --- Create New Project from Start Window ---

  - id: find_create_new_project
    type: find_control
    description: "Find 'Create a new project' button on the VS Start Window."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Create a new project", "--control-type", "Button"]
    capture:
      vars.create_proj_x: "$.rows[1].cols[7]"
      vars.create_proj_y: "$.rows[1].cols[8]"

  - id: click_create_new_project
    type: click
    description: "Click 'Create a new project' button."
    script: scripts/input/click.py
    args_expr: ["{vars.create_proj_x}", "{vars.create_proj_y}"]
    wait_after: after_dialog_action_ms

  # --- Search and select Console App ---

  - id: find_search_box
    type: find_control
    description: "Find the search box in the new project dialog."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Search", "--control-type", "ComboBox", "--match", "contains"]
    capture:
      vars.search_box_x: "$.rows[1].cols[7]"
      vars.search_box_y: "$.rows[1].cols[8]"

  - id: click_search_box
    type: click
    description: "Click on the search box."
    script: scripts/input/click.py
    args_expr: ["{vars.search_box_x}", "{vars.search_box_y}"]
    wait_after: after_focus_click_ms

  - id: type_search
    type: type_text
    description: "Type 'console app' in the search box."
    script: scripts/input/type_text.py
    args: ["{inputs.search_text}", "--interval", "0.06"]
    wait_after: after_focus_click_ms

  - id: submit_search
    type: key
    description: "Press Enter to submit the search."
    script: scripts/input/key.py
    args: ["enter"]
    wait_after: after_enter_ms

  - id: find_console_app_template
    type: find_control
    description: "Find the Console App C# template in search results."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Console App", "--control-type", "ListItem", "--match", "contains"]
    capture:
      vars.template_x: "$.rows[1].cols[7]"
      vars.template_y: "$.rows[1].cols[8]"

  - id: click_console_app
    type: click
    description: "Click the Console App template."
    script: scripts/input/click.py
    args_expr: ["{vars.template_x}", "{vars.template_y}"]
    wait_after: after_select_template_ms

  # --- Click Next twice ---

  - id: find_next_button_1
    type: find_control
    description: "Find the Next button on template selection page."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Next", "--control-type", "Button"]
    capture:
      vars.next1_x: "$.rows[1].cols[7]"
      vars.next1_y: "$.rows[1].cols[8]"

  - id: click_next_1
    type: click
    description: "Click Next to go to project configuration."
    script: scripts/input/click.py
    args_expr: ["{vars.next1_x}", "{vars.next1_y}"]
    wait_after: after_next_click_ms

  - id: find_next_button_2
    type: find_control
    description: "Find the Next button on project configuration page."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Next", "--control-type", "Button"]
    capture:
      vars.next2_x: "$.rows[1].cols[7]"
      vars.next2_y: "$.rows[1].cols[8]"

  - id: click_next_2
    type: click
    description: "Click Next to go to Additional Information page."
    script: scripts/input/click.py
    args_expr: ["{vars.next2_x}", "{vars.next2_y}"]
    wait_after: after_next_click_ms

  # --- Capture framework value and screenshot ---

  - id: screenshot_framework_page
    type: screenshot
    description: "Take screenshot of the Additional Information page."
    script: scripts/files/screenshot.py
    args_expr: ["{artifacts.screenshot_dir}/framework_page.png"]

  - id: read_framework_value
    type: read_text
    description: "Read the Framework dropdown value via UIA."
    script: scripts/uia/read_text.py
    args_expr: ["{vars.vs_hwnd}", "--name", "_Framework", "--control-type", "ComboBox"]
    capture:
      vars.framework_value: "$.cols[0]"

  # --- Click Create ---

  - id: find_create_button
    type: find_control
    description: "Find the Create button on Additional Information page."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Create", "--control-type", "Button"]
    capture:
      vars.create_x: "$.rows[1].cols[7]"
      vars.create_y: "$.rows[1].cols[8]"

  - id: click_create
    type: click
    description: "Click Create to generate the project."
    script: scripts/input/click.py
    args_expr: ["{vars.create_x}", "{vars.create_y}"]
    wait_after: after_create_click_ms

  # --- Re-find VS window after project loads (hwnd changes) ---

  - id: find_vs_editor_window
    type: find_window
    description: "Re-locate the VS window after project creation (title includes project name)."
    script: scripts/window/find_window.py
    args: ["Microsoft Visual Studio", "--backend", "uia"]
    capture:
      vars.vs_hwnd: "$.cols[1]"

  - id: maximize_vs_editor
    type: maximize
    description: "Maximize the Visual Studio window after the project is created."
    script: scripts/window/maximize_window.py
    args_expr: ["{vars.vs_hwnd}"]

  # --- Open Solution Explorer ---

  - id: find_view_menu
    type: find_control
    description: "Find the View menu."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "View", "--control-type", "MenuItem"]
    capture:
      vars.view_menu_x: "$.rows[1].cols[7]"
      vars.view_menu_y: "$.rows[1].cols[8]"

  - id: click_view_menu
    type: click
    description: "Click View menu."
    script: scripts/input/click.py
    args_expr: ["{vars.view_menu_x}", "{vars.view_menu_y}"]
    wait_after: after_menu_click_ms

  - id: find_solution_explorer_menu
    type: find_control
    description: "Find Solution Explorer menu item."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Solution Explorer", "--control-type", "MenuItem", "--match", "contains"]
    capture:
      vars.sol_exp_x: "$.rows[1].cols[7]"
      vars.sol_exp_y: "$.rows[1].cols[8]"

  - id: click_solution_explorer
    type: click
    description: "Click Solution Explorer to ensure it is open."
    script: scripts/input/click.py
    args_expr: ["{vars.sol_exp_x}", "{vars.sol_exp_y}"]
    wait_after: after_view_menu_ms

  # --- Validate Properties ---

  - id: find_solution_node
    type: find_control
    description: "Find the solution node in Solution Explorer."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "ConsoleApp", "--control-type", "TreeItem", "--match", "contains"]
    capture:
      vars.solution_node_x: "$.rows[1].cols[7]"
      vars.solution_node_y: "$.rows[1].cols[8]"

  - id: expand_solution_node
    type: click
    description: "Double-click the solution node to expand it."
    script: scripts/input/click.py
    args_expr: ["{vars.solution_node_x}", "{vars.solution_node_y}", "--double"]
    wait_after: after_focus_click_ms

  - id: find_project_node
    type: find_control
    description: "Find the project node in Solution Explorer (2nd ConsoleApp TreeItem)."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "ConsoleApp", "--control-type", "TreeItem", "--match", "contains", "--nth", "2"]
    capture:
      vars.project_node_x: "$.rows[1].cols[7]"
      vars.project_node_y: "$.rows[1].cols[8]"

  - id: right_click_project
    type: click
    description: "Click the project node to select it."
    script: scripts/input/click.py
    args_expr: ["{vars.project_node_x}", "{vars.project_node_y}"]
    wait_after: after_focus_click_ms

  - id: open_properties
    type: key
    description: "Press Alt+Enter to open Properties for selected project."
    script: scripts/input/key.py
    args: ["alt+enter"]
    wait_after: after_properties_open_ms

  - id: read_target_framework
    type: read_text
    description: "Read the Target framework value from Properties page."
    script: scripts/uia/read_text.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Target framework", "--control-type", "ComboBox"]
    capture:
      vars.target_framework: "$.cols[0]"

  - id: validate_target_framework
    type: assert_console_contains
    description: "Validate Target framework contains .NET (confirming framework is set)."
    script: scripts/uia/read_text.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Target framework", "--control-type", "ComboBox"]
    expected_contains_expr: ".NET"
    poll_total_ms: validate_poll_total_ms
    poll_interval_ms: validate_poll_interval_ms

  - id: read_output_type
    type: read_text
    description: "Read the Output type value from Properties page."
    script: scripts/uia/read_text.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Output type", "--control-type", "ComboBox"]
    capture:
      vars.output_type: "$.cols[0]"

  - id: validate_output_type
    type: assert_console_contains
    description: "Validate Output type is Console Application."
    script: scripts/uia/read_text.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Output type", "--control-type", "ComboBox"]
    expected_contains_expr: "{inputs.expected_output_type}"
    poll_total_ms: validate_poll_total_ms
    poll_interval_ms: validate_poll_interval_ms

  - id: screenshot_properties
    type: screenshot
    description: "Take screenshot of the Properties page."
    script: scripts/files/screenshot.py
    args_expr: ["{artifacts.screenshot_dir}/properties_validation.png"]

  # --- Validate .csproj ---

  - id: find_project_node_for_csproj
    type: find_control
    description: "Find the project node in Solution Explorer to open .csproj."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "ConsoleApp", "--control-type", "TreeItem", "--match", "contains", "--nth", "2"]
    capture:
      vars.csproj_x: "$.rows[1].cols[7]"
      vars.csproj_y: "$.rows[1].cols[8]"

  - id: double_click_csproj
    type: click
    description: "Double-click project node to open .csproj in the editor."
    script: scripts/input/click.py
    args_expr: ["{vars.csproj_x}", "{vars.csproj_y}", "--double"]
    wait_after: after_double_click_ms

  - id: validate_csproj_framework
    type: assert_console_contains
    description: "Validate TargetFramework element exists in .csproj editor content."
    script: scripts/uia/read_console.py
    args_expr: ["{vars.vs_hwnd}"]
    expected_contains_expr: "TargetFramework"
    poll_total_ms: validate_poll_total_ms
    poll_interval_ms: validate_poll_interval_ms

  - id: screenshot_csproj
    type: screenshot
    description: "Take screenshot of the .csproj content."
    script: scripts/files/screenshot.py
    args_expr: ["{artifacts.screenshot_dir}/csproj_validation.png"]

  # --- Build Solution ---

  - id: find_build_menu
    type: find_control
    description: "Find the Build menu."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Build", "--control-type", "MenuItem"]
    capture:
      vars.build_menu_x: "$.rows[1].cols[7]"
      vars.build_menu_y: "$.rows[1].cols[8]"

  - id: click_build_menu
    type: click
    description: "Click Build menu."
    script: scripts/input/click.py
    args_expr: ["{vars.build_menu_x}", "{vars.build_menu_y}"]
    wait_after: after_menu_click_ms

  - id: find_build_solution
    type: find_control
    description: "Find Build Solution menu item."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Build Solution", "--control-type", "MenuItem", "--match", "contains"]
    capture:
      vars.build_sol_x: "$.rows[1].cols[7]"
      vars.build_sol_y: "$.rows[1].cols[8]"

  - id: click_build_solution
    type: click
    description: "Click Build Solution."
    script: scripts/input/click.py
    args_expr: ["{vars.build_sol_x}", "{vars.build_sol_y}"]
    wait_after: after_build_ms

  - id: validate_build_success
    type: assert_console_contains
    description: "Validate build succeeded in Output window."
    script: scripts/uia/read_console.py
    args_expr: ["{vars.vs_hwnd}"]
    expected_contains_expr: "Build succeeded"
    poll_total_ms: validate_poll_total_ms
    poll_interval_ms: validate_poll_interval_ms

  - id: screenshot_build
    type: screenshot
    description: "Take screenshot after build."
    script: scripts/files/screenshot.py
    args_expr: ["{artifacts.screenshot_dir}/build_success.png"]

  # --- Run Solution ---

  - id: find_start_button
    type: find_control
    description: "Find the Start (play) button in the toolbar."
    script: scripts/uia/find_control.py
    args_expr: ["{vars.vs_hwnd}", "--name", "Start", "--control-type", "Button", "--match", "contains"]
    capture:
      vars.start_x: "$.rows[1].cols[7]"
      vars.start_y: "$.rows[1].cols[8]"

  - id: click_start
    type: click
    description: "Click the Start (play) button to run the solution."
    script: scripts/input/click.py
    args_expr: ["{vars.start_x}", "{vars.start_y}"]
    wait_after: after_run_ms

  - id: find_debug_console
    type: find_window
    description: "Find the Debug Console window that shows run output."
    script: scripts/window/find_window.py
    args: ["Debug Console", "--backend", "uia"]
    capture:
      vars.debug_hwnd: "$.cols[1]"

  - id: validate_run_success
    type: assert_console_contains
    description: "Validate the debug console shows successful execution."
    script: scripts/uia/read_console.py
    args_expr: ["{vars.debug_hwnd}"]
    expected_contains_expr: "exited with code 0"
    poll_total_ms: validate_poll_total_ms
    poll_interval_ms: validate_poll_interval_ms

  - id: screenshot_run
    type: screenshot
    description: "Take screenshot after run."
    script: scripts/files/screenshot.py
    args_expr: ["{artifacts.screenshot_dir}/run_success.png"]

  # --- Cleanup: close opened windows ---

  - id: close_debug_console
    type: close_window
    description: "Close the Debug Console window opened by the run."
    script: scripts/window/close_window.py
    args_expr: ["{vars.debug_hwnd}", "--force"]
    wait_after: after_close_ms

  - id: close_visual_studio
    type: close_window
    description: "Close the Visual Studio window to clean up."
    script: scripts/window/close_window.py
    args_expr: ["{vars.vs_hwnd}", "--force"]
    wait_after: after_close_ms

expected_results:
  - "Visual Studio (or Visual Studio Insiders) launched from Start menu and window located."
  - "New C# Console App project created with default settings."
  - "Visual Studio window maximized after project creation."
  - "Framework value captured from Additional Information dialog."
  - "Target Framework in Properties matches captured framework value."
  - "Output Type in Properties is Console Application."
  - "TargetFramework in .csproj matches captured framework value."
  - "Build Solution completes with 'Build succeeded' in Output window."
  - "Solution runs successfully with exit code 0."
  - "Screenshots saved at each validation checkpoint."
  - "Debug Console and Visual Studio windows closed on completion."
