name: Test case
description: Request a new test case
title: "[Test case] <short description>"
labels:
  - test case
  - migration
projects:
  - william051200/4
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What scenario should this test case cover?
      placeholder: Briefly describe the app under test and the goal of the scenario.
  - type: textarea
    id: expected
    attributes:
      label: Expected result / assertions
      description: What should the test verify (console output, files, screenshots)?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens when the test is run (console output, files, screenshots)?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to automate
      description: List the plain steps a user would perform (one per line). These map to rows in the CSV spec.
      placeholder: |
        1. Launch the app
        2. Click the "New" button
        3. Assert the console shows "done"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Environment details, blockers, related issues, or reproducibility notes.
    validations:
      required: false
